    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

function useSpeech() {
    // 朗讀播放器狀態
    const [playbackState, setPlaybackState] = useState('stopped'); // 'stopped' | 'playing' | 'paused'
    const playbackStateRef = useRef(playbackState);
    const [currentUtterance, setCurrentUtterance] = useState(null);
    
    useEffect(() => {
        playbackStateRef.current = playbackState;
    }, [playbackState]);

    // 🔁 循環播放狀態與 Ref
    const [isLooping, setIsLooping] = useState(false);
    const isLoopingRef = useRef(isLooping);
    
    useEffect(() => {
        isLoopingRef.current = isLooping;
    }, [isLooping]);

    // 📝 文本與位置追蹤（實現無縫接續語速的關鍵）
    const fullTextRef = useRef('');             // 原始完整文字
    const formattedTextRef = useRef('');        // 優化校正後的完整文字
    const currentCharIndexRef = useRef(0);      // 當前朗讀到的字元索引 (全域)
    const utteranceStartOffsetRef = useRef(0);  // 當前段落發音在全文中的起始位置

    // ⚡ 語速狀態與 Ref
    const [speechRate, setSpeechRate] = useState(1.0);
    const speechRateRef = useRef(speechRate);

    useEffect(() => {
        speechRateRef.current = speechRate;
    }, [speechRate]);

    const RATES = [1.0, 1.5, 2, 2.5];
    const handleRateChange = useCallback(() => {
        setSpeechRate(prev => {
            const currentIndex = RATES.indexOf(prev);
            const nextIndex = (currentIndex + 1) % RATES.length;
            return RATES[nextIndex];
        });
    }, []);

    // 廣東話朗讀文字優化與破音字校正
    const formatCantoneseText = useCallback((rawText) => {
        if (!rawText) return '';
        let text = rawText;
        text = text.replace(/[\r\n]+/g, '，');
        text = text.replace(/[─—…]+/g, '，');
        
        const cantoneseFixMap = {
            '宛':'苑', '鋏':'夾','好此':'浩此','被明月':'披明月','吾':'吳','虯':'求', '驂':'攙', '欸':'哀', 
            '朝':'招','漵':'敘','猨':'猿','狖':'穴', '重':'從', '薄':'逼', '易':'亦', '齕':'核', '予':'魚', '傺':'祭', 
            '焉':'驠', '則王乎':'則旺乎', '可以王矣':'可以旺矣', '保民而王':'保民而旺','足以王':'足以旺', '褊小':'貶小', '彼惡':'彼塢', '夫我':'扶我', '王之不王':'王之不旺', '觳':'酷', '以王為愛':'以王維愛','不為':'不維','度之':'踱之', '度':'踱', '為長者':'衛掌者','所為':'所維','為不用':'維不用','長短':'詳短','心為甚':'心維甚', 
            '生':'牲','踦':'綺','默然不應':'默然不褮',
            '說秦王書十上而說不行':'稅秦王書十上而稅不行','羸滕履蹻':'贏滕履腳','擔':'耽','狀有歸色':'狀有愧色','紝':'壬','妻不以我為夫':'妻不以我維夫','嫂不以我為叔':'嫂不以我維叔','父母不以我為子':'父母不以我維子','陳箧':'陳匣','說人主':'稅人主','說當世':'稅當世','將說楚':'將稅楚','張樂': '張鑩','聽':'廷','勢位':'勢惠',
            '鴻門會':'鴻門匯','軍中無以為樂':'軍中無以為鑩','噲':'塊','目眥':'目治','跽':'技','參乘':'驂乘','夫秦王':'扶秦王','諸將':'諸障','咸陽者王之':'咸陽者旺之','須臾':'須如','間至軍':'諫至軍','桮杓':'杯削','璧':'碧',
            '烏可食':'烏何食','蒲葦冥冥':'蒲葦覓覓','梟騎':'梟忌','駑':'奴','君可食':'君何食','朝行':'朝恆',
            '人生':'人牲','笙':'牲','為君故':'胃君故','斷絕':'段絕', '契闊談讌':'舌闊談驠','越陌度阡':'越陌道阡',
            '粟':'律','邑':'泣','會有四':'匯有四','足以為酒':'足以圍酒','悵':'暢','稔':'黏','覺':'角','僮':'童','觴':'傷','易安':'二安','樂琴':'拗琴','巾車':'巾居','樂夫':'樂扶','知還':'知旋',
            '復':'阜','請君爲我':'請君衛我','平樂':'平洛','主人何為':'主人何慧','少錢':'少前',
	    '嬉':'曦','先生':'先牲','率':'恤','蓋':'概','觝':'抵','纂':'撙','補苴罅漏':'補追罅漏','咀華':'咀花','少始':'笑始','左右具宜':'左右俱宜','':'','':'','':'',
            '滁':'徐','琅邪':'琅爺','太守':'泰秀','若夫':'若扶','繁陰':'繁蔭','後者應':'後者瀅','傴僂':'如樓','谿':'溪','魚肥':'如肥', '蔌':'瘦','懽':'歡','禽鳥樂':'禽鳥洛','樂其樂':'拗其落','散亂':'傘亂','釀泉為酒':'釀泉圍酒',
            '齊天樂':'齊天愕','正玉液':'政玉液','斜':'輋','秋思':'秋事','篘':'初',
            '縱荒墳':'種荒墳','上牀':'想牀','屐':'履','葫蘆':'胡驢','一覺':'一教',
            '':'','':'','':'','':'','':'','':'','':'','':'','':'','':'','':'','':'','':'','女':'汝'
 
        };
        Object.keys(cantoneseFixMap).forEach((key) => {
            text = text.replaceAll(key, cantoneseFixMap[key]);
        });
        return text;
    }, []);

    // 🗣️ 從指定位置（startIndex）開始朗讀的核心函數
    const speakFromIndex = useCallback((startIndex = 0) => {
        if (!window.speechSynthesis || !formattedTextRef.current) return;

        // 強制停止之前的語音
        window.speechSynthesis.cancel();

        // 截取剩餘未朗讀的文本
        const remainingText = formattedTextRef.current.slice(startIndex);
        
        // 如果已經讀完全文
        if (!remainingText.trim()) {
            if (isLoopingRef.current) {
                speakFromIndex(0); // 循環播放：從頭開始
            } else {
                setPlaybackState('stopped');
            }
            return;
        }

        // 記錄本次發音段落的起始偏移量
        utteranceStartOffsetRef.current = startIndex;
        currentCharIndexRef.current = startIndex;

        const utterance = new SpeechSynthesisUtterance(remainingText);
        utterance.lang = 'zh-HK';
        utterance.rate = speechRateRef.current; // 使用最新語速

        utterance.onstart = () => setPlaybackState('playing');

        // 🎯 關鍵：追蹤目前讀到哪一個字
        utterance.onboundary = (event) => {
            // event.charIndex 是當前段落的相對索引，加上起始偏移量即可得到全文索引
            currentCharIndexRef.current = utteranceStartOffsetRef.current + event.charIndex;
        };
        
        utterance.onend = () => {
            if (isLoopingRef.current) {
                setTimeout(() => {
                    speakFromIndex(0); // 單曲循環時，重新從第 0 個字開始
                }, 100);
            } else {
                setPlaybackState('stopped');
            }
        };
        
        utterance.onerror = (e) => {
            // 切換語速呼叫 cancel() 會觸發 interrupted/canceled 錯誤，需忽略它避免狀態誤設為 stopped
            if (e.error !== 'interrupted' && e.error !== 'canceled') {
                setPlaybackState('stopped');
            }
        };

        setCurrentUtterance(utterance);
        window.speechSynthesis.speak(utterance);
    }, []);

    // ⚡ 語速改變時的動態銜接處理
    const isFirstRender = useRef(true);
    useEffect(() => {
        if (isFirstRender.current) {
            isFirstRender.current = false;
            return;
        }

        const activeStates = ['playing', 'paused'];
        if (activeStates.includes(playbackStateRef.current) && formattedTextRef.current) {
            // 立即從 currentCharIndexRef 位置，以新語速繼續朗讀！
            speakFromIndex(currentCharIndexRef.current);
        }
    }, [speechRate, speakFromIndex]);

    // 播放 / 恢復功能
    const playSpeech = useCallback((text) => {
        if (!window.speechSynthesis) return;

        // 若正處於暫停狀態，且沒有傳入新文章，則直接恢復播放
        if (playbackState === 'paused' && (!text || text === fullTextRef.current)) {
            window.speechSynthesis.resume();
            setPlaybackState('playing');
            return;
        }

        // 開始全新的朗讀
        fullTextRef.current = text;
        formattedTextRef.current = formatCantoneseText(text);
        currentCharIndexRef.current = 0;

        speakFromIndex(0);
    }, [playbackState, formatCantoneseText, speakFromIndex]);

    // 暫停功能
    const pauseSpeech = useCallback(() => {
        if (window.speechSynthesis) {
            window.speechSynthesis.pause();
            setPlaybackState('paused');
        }
    }, []);

    // 停止功能
    const stopSpeech = useCallback(() => {
        if (window.speechSynthesis) {
            window.speechSynthesis.cancel();
            currentCharIndexRef.current = 0;
            setPlaybackState('stopped');
        }
    }, []);

    // 組件卸載時清理
    useEffect(() => {
        return () => {
            if (window.speechSynthesis) window.speechSynthesis.cancel();
        };
    }, []);

    return { 
        playbackState, 
        playSpeech, 
        pauseSpeech, 
        stopSpeech,
        isLooping,
        setIsLooping,
        speechRate,
        handleRateChange
    };
}

const preloadAudio = (src) => {
    return new Promise((resolve) => {
        const audio = new Audio();
        audio.src = src;
        
        // 2秒逾時機制，避免 Promise 卡死全站
        const timer = setTimeout(() => {
            resolve({ status: 'timeout', src });
        }, 2000);

        audio.addEventListener('canplaythrough', () => {
            clearTimeout(timer);
            resolve({ status: 'success', src });
        }, { once: true });

        audio.addEventListener('error', () => {
            clearTimeout(timer);
            resolve({ status: 'error', src });
        }, { once: true });

        audio.load();
    });
};

    fadeYouTubeVolume(targetRatio, duration = 1500) {
        const player = window.ytPlayer || (typeof ytPlayer !== 'undefined' ? ytPlayer : null);
        if (!player || typeof player.getVolume !== 'function') return;

        if (this.ytFadeInterval) clearInterval(this.ytFadeInterval);

        if (this.bgmMuted || this.userBgmVolume === 0) {
            player.setVolume(0);
            if (typeof player.pauseVideo === 'function') player.pauseVideo();
            return;
        }

        let currentVolume = player.getVolume();
        const targetVolume = this.userBgmVolume * targetRatio; 
        const steps = 20; 
        const intervalTime = duration / steps;
        const volumeStep = (targetVolume - currentVolume) / steps;

        // 若是淡入且為暫停狀態，先啟動播放
        if (targetRatio > 0 && typeof player.playVideo === 'function') {
            player.playVideo(); 
        }

        this.ytFadeInterval = setInterval(() => {
            currentVolume += volumeStep;
            
            if (volumeStep === 0 || 
                (volumeStep > 0 && currentVolume >= targetVolume) || 
                (volumeStep < 0 && currentVolume <= targetVolume)) {
                
                player.setVolume(targetVolume);
                // 淡出到底時暫停播放節省資源
                if (targetRatio === 0 && typeof player.pauseVideo === 'function') {
                    player.pauseVideo();
                }
                clearInterval(this.ytFadeInterval);
                this.ytFadeInterval = null;
            } else {
                player.setVolume(Math.round(currentVolume));
            }
        }, intervalTime);
    }

    fadeAudio(audioElement, targetVol, duration = 1500, callback) {
        if (!audioElement) return;
        if (audioElement.fadeInterval) clearInterval(audioElement.fadeInterval);
        
        const steps = 20;
        const intervalTime = duration / steps;
        let currentVol = audioElement.volume || 0;
        const volumeStep = (targetVol - currentVol) / steps;
        
        // 確保淡入前是播放狀態
        if (targetVol > 0 && !this.bgmMuted) audioElement.play().catch(()=>{});

        audioElement.fadeInterval = setInterval(() => {
            currentVol += volumeStep;
            if (volumeStep === 0 || 
                (volumeStep > 0 && currentVol >= targetVol) || 
                (volumeStep < 0 && currentVol <= targetVol)) {

                audioElement.volume = Math.max(0, Math.min(1, targetVol));
                clearInterval(audioElement.fadeInterval);
                audioElement.fadeInterval = null;
                if (callback) callback();
            } else {
                audioElement.volume = Math.max(0, Math.min(1, currentVol));
            }
        }, intervalTime);
    }

    playSFX(name, volume = 1) {
        if (this.sfxMuted) return; 
        if (this.sfx[name]) {
            const soundClone = this.sfx[name].cloneNode();
            soundClone.volume = volume;
            soundClone.play().catch(() => {}); // 避免連續點擊報錯
        }
    }

    startAmbient() {
        if (window.ytError && !this.isGameMode) {
            const targetVol = this.bgmMuted ? 0 : this.userBgmVolume;
            this.ambientWind.volume = (targetVol / 100) * 0.7;
            this.ambientWind.muted = this.bgmMuted;
            if (targetVol > 0) this.ambientWind.play().catch(()=>{});
        }
    }

enterGameMode(audioSrc) {
        this.isGameMode = true;
        const targetVol = this.bgmMuted ? 0 : this.userBgmVolume;
        
        // 1. YouTube 完全淡出
        this.fadeYouTubeVolume(0, 1500); 

        if (audioSrc) {
            // ==========================================
            // 狀況 A：關卡有配置專屬音樂 (audioSrc 存在)
            // ==========================================
            
            // 確定要播新音樂了，先把 Home 頁面的備用風聲淡出停止
            if (this.ambientWind && !this.ambientWind.paused && window.ytError) {
                 this.fadeAudio(this.ambientWind, 0, 1000, () => this.ambientWind.pause());
            }

            // 建立或切換關卡專屬音樂
            if (this.currentAmbience && this.currentAmbience.src !== new URL(audioSrc, document.baseURI).href) {
                this.currentAmbience.pause();
                this.currentAmbience = new Audio(audioSrc);
            } else if (!this.currentAmbience) {
                this.currentAmbience = new Audio(audioSrc);
            }

            // 【優化】監聽音檔載入錯誤 (例如 404 找不到檔案)
            this.currentAmbience.onerror = () => {
                console.warn(`[Audio Debug] ⚠️ 找不到音樂檔: ${audioSrc}，自動接軌備用風聲。`);
                
                // 放棄壞掉的音樂檔，將狀態切回 null，讓系統判定為無關卡音樂
                this.currentAmbience = null;
                
                if (this.ambientWind) {
                    this.ambientWind.muted = this.bgmMuted;
                    if (targetVol > 0 && !this.bgmMuted) {
                        // 重新把原本的風聲淡入接軌（如果是從 Home 首頁進來，這裡會無縫把剛降下去的音量拉回來）
                        this.fadeAudio(this.ambientWind, (targetVol / 100) * 0.7, 1500);
                    }
                }
            };

            this.currentAmbience.loop = true;
            this.currentAmbience.muted = this.bgmMuted;
            this.currentAmbience.volume = 0; 
            
            if (targetVol > 0 && !this.bgmMuted) {
                this.fadeAudio(this.currentAmbience, (targetVol / 100) * 0.9, 1500);
            }

        } else {
            // ==========================================
            // 狀況 B：沒有配置音效，直接使用備用風聲
            // ==========================================
            this.currentAmbience = null; 

            if (this.ambientWind) {
                this.ambientWind.muted = this.bgmMuted;
                const targetWindVol = (targetVol / 100) * 0.7;

                if (targetVol > 0 && !this.bgmMuted) {
                    // 【關鍵優化】判斷風聲是否已經在播放中
                    if (!this.ambientWind.paused && this.ambientWind.volume > 0) {
                        console.log("[Audio Debug] 🌬️ 無專屬音樂，延續播放原有的環境風聲 (不重頭播放)");
                        // 直接調整音量到目標值，不將 volume 歸零重播
                        this.fadeAudio(this.ambientWind, targetWindVol, 1500);
                    } else {
                        // 如果原本沒在播，才從 0 重新淡入
                        this.ambientWind.volume = 0;
                        this.fadeAudio(this.ambientWind, targetWindVol, 1500);
                    }
                } else {
                    this.fadeAudio(this.ambientWind, 0, 1000, () => this.ambientWind.pause());
                }
            }
        }
    }

exitGameMode() {
        this.isGameMode = false;
        const targetVol = this.bgmMuted ? 0 : this.userBgmVolume;

        // 1. 先測試 YouTube 是否能夠正常連線與播放
        let ytWillPlay = false;
        const player = window.ytPlayer || (typeof ytPlayer !== 'undefined' ? ytPlayer : null);
        
        if (player && typeof player.playVideo === 'function') {
            window.ytError = false; // 先重置錯誤狀態，給予重試機會
            try {
                player.playVideo();
                ytWillPlay = true; // 標記 YT 播放指令下達成功
            } catch (e) {
                window.ytError = true;
            }
        } else {
            window.ytError = true;
        }

        // 2. 根據 YouTube 的連線狀態，決定要怎麼處理環境音與背景音樂
        if (ytWillPlay) {
            // ==========================================
            // 狀況 A：YouTube 恢復成功
            // ==========================================
            this.fadeYouTubeVolume(1.0, 1500);

            // 淡出並暫停關卡專屬音樂
            if (this.currentAmbience) {
                this.fadeAudio(this.currentAmbience, 0, 1000, () => {
                    if (this.currentAmbience) this.currentAmbience.pause();
                });
            }
            // 既然 YT 活著，就把風聲也淡出暫停
            if (this.ambientWind && !this.ambientWind.paused) {
                this.fadeAudio(this.ambientWind, 0, 1000, () => {
                    this.ambientWind.pause();
                });
            }

        } else {
            // ==========================================
            // 狀況 B：YouTube 連線失敗，首頁必須依賴備用風聲
            // ==========================================
            
            // 首先，如果有關卡專屬音樂，把它淡出停止
            if (this.currentAmbience) {
                this.fadeAudio(this.currentAmbience, 0, 1000, () => {
                    if (this.currentAmbience) this.currentAmbience.pause();
                });
            }

            // 處理備用風聲
            if (this.ambientWind) {
                this.ambientWind.muted = this.bgmMuted;
                const targetWindVol = (targetVol / 100) * 0.7;

                if (targetVol > 0 && !this.bgmMuted) {
                    // 【關鍵優化】如果風聲剛好在關卡中就已經在播放，我們「完全不打斷它」！
                    if (!this.ambientWind.paused && this.ambientWind.volume > 0) {
                        console.log("[Audio Debug] 🌬️ YT失敗且風聲已在播放，無縫過渡至首頁");
                        // 只做平滑的音量校正（以防 Home 與 Game 的風聲目標音量有微調）
                        this.fadeAudio(this.ambientWind, targetWindVol, 1500);
                    } else {
                        // 如果關卡本來是播專屬音樂，現在才要接手風聲，那就從 0 開始淡入
                        this.ambientWind.volume = 0;
                        this.fadeAudio(this.ambientWind, targetWindVol, 1500);
                    }
                } else {
                    this.fadeAudio(this.ambientWind, 0, 1000, () => this.ambientWind.pause());
                }
            }
        }
    }
}

        function useLocalStorage(key, initialValue) {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) { return initialValue; }
            });
            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));

const RippleButton = ({ className, style, onClick, ...props }) => {
  const [ripples, setRipples] = React.useState([]);

  const handleClick = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const x = e.clientX - rect.left - size / 2;
    const y = e.clientY - rect.top - size / 2;

    const newRipple = { id: Date.now(), x, y, size };
    setRipples((prev) => [...prev, newRipple]);

    setTimeout(() => {
      setRipples((prev) => prev.filter((r) => r.id !== newRipple.id));
    }, 600);

    if (onClick) onClick(e);
  };

  return (
    <button
      {...props}
      onClick={handleClick}
      // 保留原本所有 CSS，並確保 relative 與 overflow-hidden 以容納波紋
      className={`relative overflow-hidden ${className}`}
      style={style}
    >
      {/* 渲染點擊的波紋 */}
      {ripples.map((r) => (
        <span
          key={r.id}
          className="absolute rounded-full bg-white/40 ripple-effect pointer-events-none"
          style={{
            top: r.y,
            left: r.x,
            width: r.size,
            height: r.size,
          }}
        />
      ))}
    </button>
  );
};

            if (e.shiftKey) {

                                                            <i className="fa-solid fa-feather-pointed" aria-hidden="true"></i> 意象睇頭：
                                                        </p>
                                                        <p className="text-gray-300 text-[11px] leading-relaxed tracking-wide">
                                                            {cantoneseDescText}
                                                        </p>
                                                    </div>
                                                </>
                                            )}
                                        </div>
                                    </div>
                                );
                            })
                        )}
                    </div>
                ) : (
                    /* Tab 2: 篇章全文與朗讀功能 */
                    <div 
                        id="panel-full" 
                        role="tabpanel" 
                        aria-labelledby="tab-full" 
                        className="flex flex-col items-center py-1 space-y-4 outline-none"
                        tabIndex={0}
                    >
                        <div className="text-center border-b border-[#c9a76b]/20 pb-3 w-full">
                            <h4 className="text-sm font-bold text-[#c9a76b] tracking-[0.2em]">{poem.title}</h4>
                            {poem.author && <p className="text-xs text-gray-400 mt-1 tracking-widest">{poem.author}</p>}
                        </div>

                        {/* 🌟 優化版朗讀按鈕 */}
                        <div 
                            className="flex gap-2 w-full px-[5px]"
                            role="group"
                            aria-label="全文語音朗讀控制"
                        >
                            {playbackState !== 'playing' ? (
                                <button
                                    type="button"
                                    onClick={() => {
                                        const rawText = Array.isArray(poem.fullText) 
                                            ? poem.fullText.map(line => line.replace(/[「『]/g, '，').replace(/[」』]/g, '。')).join('，') 
                                            : (poem.fullText || poem.content)
                                                .replace(/[「『]/g, '，')
                                                .replace(/[」』]/g, '。');

                                        playSpeech(`${poem.title}。${rawText}`);
                                    }}
                                    className="flex-1 flex items-center justify-center gap-2 py-2 rounded border border-[#c9a76b] bg-[#c9a76b]/15 text-[#e0d5ba] text-xs font-bold tracking-[0.2em] hover:bg-[#c9a76b]/30 active:scale-95 transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-[#c9a76b]"
                                    aria-label={playbackState === 'paused' ? '繼續朗讀全文' : '朗讀全文'}
                                >
                                    <i className="fa-solid fa-play" aria-hidden="true"></i>
                                    {playbackState === 'paused' ? '繼續朗讀' : '朗讀篇章'}
                                </button>
                            ) : (
                                <button
                                    type="button"
                                    onClick={pauseSpeech}
                                    className="flex-1 flex items-center justify-center gap-2 py-2 rounded border border-[#f5d38a] bg-[#f5d38a]/20 text-[#f5d38a] animate-pulse text-xs font-bold tracking-[0.2em] active:scale-95 transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-[#f5d38a]"
                                    aria-label="暫停朗讀全文"
                                >
                                    <i className="fa-solid fa-pause" aria-hidden="true"></i>
                                    暫停朗讀
                                </button>
                            )}
                            
                            {/* 停止按鈕 (只有在播放或暫停時出現) */}
                            {playbackState !== 'stopped' && (
                                <button
                                    type="button"
                                    onClick={stopSpeech}
                                    className="w-10 flex items-center justify-center rounded border border-red-400/50 bg-red-400/10 text-red-400 hover:bg-red-400/20 active:scale-95 transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-red-400"
                                    title="停止"
                                    aria-label="停止朗讀全文"
                                >
                                    <i className="fa-solid fa-stop text-sm" aria-hidden="true"></i>
                                </button>
                            )}
                        </div>

                        {/* 全文呈現 */}
                        <div 
                            className="w-full leading-relaxed text-[13px] tracking-[0.15em] text-[#e0d5ba] space-y-5 py-2 text-center"
                            style={{ fontFamily: "'Noto Serif TC', serif" }}
                        >
                            {Array.isArray(poem.fullText) ? (
                                poem.fullText.map((paragraph, i) => (
                                    <p key={i} className="whitespace-pre-line">
                                        {paragraph}
                                    </p>
                                ))
                            ) : (
                                <p className="whitespace-pre-line">
                                    {poem.fullText || poem.content}
                                </p>
                            )}
                        </div>
                    </div>
                )}
            </div>
        </div>
    </div>
)}

                    {showCompletion && (
                        <div className="absolute inset-0 bg-black/65 backdrop-blur-md z-50 flex items-center justify-center p-6 animate-fade-in pointer-events-auto">
                            <div className="relative w-full max-w-[280px] bg-[#14120e] border-2 border-[#c9a76b]/70 rounded-lg p-6 flex flex-col items-center text-center shadow-[0_0_30px_rgba(0,0,0,0.9),0_0_15px_rgba(201,167,107,0.2)]">
                                <div className="absolute inset-1 border border-[#c9a76b]/25 rounded pointer-events-none"></div>
                                <div className="absolute top-2 left-2 w-2 h-2 border-t-2 border-l-2 border-[#c9a76b]"></div>
                                <div className="absolute top-2 right-2 w-2 h-2 border-t-2 border-r-2 border-[#c9a76b]"></div>
                                <div className="absolute bottom-2 left-2 w-2 h-2 border-b-2 border-l-2 border-[#c9a76b]"></div>
                                <div className="absolute bottom-2 right-2 w-2 h-2 border-b-2 border-r-2 border-[#c9a76b]"></div>

                                <div className="w-14 h-14 rounded-full border-2 border-[#c9a76b] flex items-center justify-center mb-4 bg-red-950/30 shadow-[0_0_15px_rgba(185,28,28,0.3)]">
                                    <i className="fa-solid fa-award text-[#c9a76b] text-2xl"></i>
                                </div>

                                <h2 className="text-lg text-[#e0d5ba] tracking-[0.3em] font-bold mb-1" aria-label="典藏入卷">典藏入卷</h2>
                                <div className="w-12 h-[1px] bg-[#c9a76b]/40 my-2"></div>
                                
                                <p className="text-gray-300 text-xs mb-6 tracking-wider leading-relaxed" aria-label="恭喜完成此篇關卡">
                                    恭喜完成《<span className="text-[#c9a76b]">{poem.title}</span>》<br/>意象探索與詩境解鎖
                                </p>

                                <button 
                                    onClick={onComplete} aria-label="返回"
                                    className="w-full py-2.5 rounded border border-[#c9a76b] bg-[#c9a76b]/15 text-[#e0d5ba] hover:bg-[#c9a76b]/30 active:scale-95 transition-all text-xs tracking-[0.2em] font-bold shadow-md clickable-hotspot"
                                >
                                    返回主頁
                                </button>
                            </div>
                        </div>
                    )}

{/* 設定彈窗 Overlay (GamePlayArea 專用) */}
{showGameSettings && (
    <div className="settings-overlay absolute inset-0 z-50 bg-black/60 backdrop-blur-sm flex flex-col items-center justify-center animate-fade-in pointer-events-auto px-6">
        <div className="bg-[#11100e] border border-[#4a3f2b] rounded-xl w-full max-w-xs p-5 relative bg-[#14120e] border-2 border-[#c9a76b]/70 rounded-lg p-5 text-[#e0d5ba] shadow-[0_0_20px_rgba(201,167,107,0.15)]">
            <h2 className="text-base text-[#c9a76b] tracking-[0.2em] font-bold text-center mb-5 border-b border-[#2d281f] pb-3">系統設置</h2>
            
            <div className="space-y-4 mb-6 px-1" role="dialog" aria-modal="true">
                {/* 背景音樂開關 */}
                <div className="flex justify-between items-center">
                    <span className="text-[#e0d5ba] tracking-widest text-xs" aria-label="背景音樂">背景音樂</span>
                    
                    {/* 👇 在這裡加入三元運算子判斷 */}
                    {!isTouchOrMobile ? (
                        <input 
                            type="range" 
                            min="0" max="100" step="1"
                            value={audioSettings.bgmVolume}
                            onChange={(e) => setAudioSettings({ ...audioSettings, bgmVolume: parseFloat(e.target.value), bgm: true })}
                            className="w-[45%] h-1.5 bg-[#2d281f] rounded-lg appearance-none cursor-pointer accent-[#c9a76b]"
                            style={{ opacity: audioSettings.bgm ? 1 : 0.4 }}
                        />
                    ) : (
                        <div className="w-[45%]"></div> /* 觸控設備（含 iPad）顯示空白佔位，保持排版不變 */
                    )}

                    <button 
aria-label={audioSettings.bgm ? "關閉背景音樂" : "開啟背景音樂"}
    aria-pressed={audioSettings.bgm}
                        className={`w-10 h-5 rounded-full relative transition-colors duration-300 clickable-hotspot ${audioSettings.bgm ? 'bg-[#c9a76b]' : 'bg-gray-700'}`} 
                        onClick={() => {
                            if (window.SM || typeof SM !== 'undefined') SM.playSFX('click');
                            setAudioSettings({...audioSettings, bgm: !audioSettings.bgm}); title="切換音量"
                        }}
                    >
                        <div className={`w-3.5 h-3.5 bg-[#11100e] rounded-full absolute top-0.5 transition-transform duration-300 ${audioSettings.bgm ? 'translate-x-6' : 'translate-x-0.5'}`}></div>
                    </button>
                </div>

                {/* 環境音效開關 */}
                <div className="flex justify-between items-center">
                    <span className="text-[#e0d5ba] tracking-widest text-xs" aria-label="環境音效">環境音效</span>
                    <div className="w-[45%]"></div> {/* 佔位對齊 */}
                    <button 
aria-label={audioSettings.sfx ? "關閉環境音效" : "開啟環境音效"}
    aria-pressed={audioSettings.sfx}
                        className={`w-10 h-5 rounded-full relative transition-colors duration-300 clickable-hotspot ${audioSettings.sfx ? 'bg-[#c9a76b]' : 'bg-gray-700'}`} 
                        onClick={() => {
                            if (window.SM || typeof SM !== 'undefined') SM.playSFX('click');
                            setAudioSettings({...audioSettings, sfx: !audioSettings.sfx});
                        }}
                    >
                        <div className={`w-3.5 h-3.5 bg-[#11100e] rounded-full absolute top-0.5 transition-transform duration-300 ${audioSettings.sfx ? 'translate-x-6' : 'translate-x-0.5'}`}></div>
                    </button>
                </div>
            </div>

            {/* 字體大小選擇 */}
            <div className="pt-2">
                <div className="flex justify-between items-center mb-1.5">
                    <span className="text-[#e0d5ba] tracking-widest text-xs">字體大小</span>
                    <span className="text-[#c9a76b] font-bold text-[10px] uppercase">{fontSize === 'sm' ? '標準' : fontSize === 'lg' ? '大' : '中'}</span>
                </div>
                <div className="flex gap-2.5">
                    {['sm', 'md', 'lg'].map(sz => (
                        <button 
                            key={sz} 
                            aria-label={`設定字體大小為${sz === 'sm' ? '小' : sz === 'md' ? '中' : '大'}`}
    aria-pressed={fontSize === sz}
                            onClick={() => {
                                if (window.SM || typeof SM !== 'undefined') SM.playSFX('click');
                                setFontSize(sz);
                            }} 
                            className={`flex-1 py-1 rounded text-[10px] tracking-widest transition-all clickable-hotspot border ${fontSize === sz ? 'bg-[#c9a76b]/20 border-[#c9a76b] text-[#c9a76b]' : 'bg-transparent border-[#2d281f] text-gray-500'}`}
                        >
                            {sz === 'sm' ? '小' : sz === 'md' ? '中' : '大'}
                        </button>
                    ))}
                </div>
            </div>

            {/* 關閉按鈕 */}
            <div className="flex flex-col gap-3 mt-4 border-t border-[#2d281f] pt-4">
                <button className="ink-button w-full py-2 rounded tracking-widest text-xs clickable-hotspot font-medium" aria-label="關閉"
                    onClick={() => {if (window.SM || typeof SM !== 'undefined') SM.playSFX('click'); setShowGameSettings(false);}}
                >
                    關閉
                </button>
            </div>
        </div>
    </div>
)}
</div> 
    );
}


function InkRingButton({ iconClass, onClick, active, label, customAriaLabel, isGlowing = false, sfxType = 'click', ...props }) {
    
    // 🌟 包裝點擊事件，先播放音效再執行原本的 onClick
    const handleClick = (e) => {
        if (sfxType && window.SM) {
            window.SM.playSFX(sfxType);
        }
        if (onClick) {
            onClick(e);
        }
    };

    return (
        <button type="button"
            role="tab"
            aria-selected={active}
            aria-label={customAriaLabel || label}
            title={label}
            onClick={handleClick} 
            className="flex flex-col items-center justify-center group focus:outline-none clickable-hotspot p-1 -m-1"{...props}
        >
            <div className={`relative w-6 h-6 flex items-center justify-center transition-all duration-300 active:scale-90 ${
                active ? 'scale-105' : 'scale-100'
            }`}>
                <div className={`absolute inset-0 rotate-45 border transition-all duration-500 rounded-[3px] ${
                    active 
                        ? 'border-[#c9a76b] bg-[#c9a76b]/15 shadow-[0_0_10px_rgba(201,167,107,0.4)]' 
                        : 'border-[#2d281f] bg-[#12110e]/80 group-hover:border-gray-500'
                }`} />

                {active && (
                    <div className="absolute inset-0 rotate-45 border border-[#c9a76b]/40 rounded-[3px] scale-125 pointer-events-none" />
                )}

                <div className="z-10">
                    <i className={`${iconClass} text-xs pb-2 ${active ? 'text-[#c9a76b]' : 'text-gray-400'}`}></i>
                </div>
            </div>

            <span className={`text-[9px] mt-1 tracking-wider transition-all ${
                isGlowing 
                    ? 'text-[#fff5d1] font-bold drop-shadow-[0_0_8px_rgba(201,167,107,1)] animate-pulse' 
                    : active ? 'text-[#c9a76b]' : 'text-gray-400'
            }`}>
                {label}
            </span>
        </button>
    );
}

// 最後是 React 的渲染掛載
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(
    <App />
);

(function() {
    // 1. 禁止滑鼠右鍵選單 (Context Menu)
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      return false;
    }, false);

    // 2. 禁止圖片拖曳 (Image Dragging)
    document.addEventListener('dragstart', function(e) {
      if (e.target.tagName === 'IMG') {
        e.preventDefault();
        return false;
      }
    }, false);

    // 3. 封鎖開啟開發者工具 (DevTools) 與檢視原始碼的快捷鍵
    document.addEventListener('keydown', function(e) {
      // 判斷是否按下 Ctrl (Windows) 或 Cmd (Mac)
      const isCmdOrCtrl = e.ctrlKey || e.metaKey;
      const isAltOrOption = e.altKey;

      // 按鍵判斷
      // - F12
      // - Ctrl + Shift + I (開發者工具)
      // - Ctrl + Shift + J (控制台)
      // - Ctrl + Shift + C (元素檢查器)
      // - Ctrl + U (檢視原始碼)
      // - Ctrl + S (儲存網頁)
      // - Cmd + Option + I / J / C / U (Mac 快捷鍵)
      if (
        e.key === 'F12' ||
        (isCmdOrCtrl && e.shiftKey && ['I', 'J', 'C', 'i', 'j', 'c'].includes(e.key)) ||
        (isCmdOrCtrl && (e.key === 'u' || e.key === 'U')) ||
        (isCmdOrCtrl && (e.key === 's' || e.key === 'S')) ||
        (isCmdOrCtrl && isAltOrOption && ['I', 'J', 'C', 'U', 'i', 'j', 'c', 'u'].includes(e.key))
      ) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }
    }, true);
  })();
</script>
</body>
