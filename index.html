    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;
	function YourComponent() {
    const scrollRef = useRef(null);
    const timerRef = useRef(null);

    const handleScroll = () => {
        const el = scrollRef.current;
        if (!el) return;

        // 瞬間顯示滑塊
        if (!el.classList.contains('is-scrolling')) {
            el.classList.add('is-scrolling');
        }

        // 重新倒數計時
        if (timerRef.current) clearTimeout(timerRef.current);

        // 停下滑動 600ms 後淡出
        timerRef.current = setTimeout(() => {
            if (el) el.classList.remove('is-scrolling');
        }, 600);
    };

    return (
        <div className="space-y-4">
            <h2>系統設置</h2>
            
            {/* 直接在滾動的 div 上掛載 ref 與 onScroll */}
            <div 
                ref={scrollRef}
                onScroll={handleScroll}
                className="gold-overlay-scroll fade-mask-list max-h-[55vh] space-y-3"
            >
                {/* 你的內容 */}
            </div>
        </div>
    );
}

        window.addEventListener('DOMContentLoaded', () => {
          preloadAssets();
          preloadFonts();
        });

        function preloadAssets() {
          const imagesToPreload = [
            './loading.webp',
            './start.webp',
            './startbtn.webp',
            './loading-icon.webp',
            './game.webp'
          ];
          imagesToPreload.forEach(src => {
            const img = new Image();
            img.src = src;
          });
        }

        function preloadFonts() {
          if ('fonts' in document) {
            document.fonts.load('16px "Noto Serif TC"').then(() => {
              console.log('字體已在後台下載完畢');
            });
          }
        }

        let ytPlayer;
        function onYouTubeIframeAPIReady() {
          ytPlayer = new YT.Player('yt-player', {
            height: '0', width: '0', videoId: '11pvOw2DZ58',
            playerVars: { 'autoplay': 0, 'loop': 1, 'playlist': '11pvOw2DZ58' },
            events: {
              'onReady': (event) => {
                window.ytPlayer = event.target;
                event.target.setVolume(100);
              }
            }
          });
        }

        class SoundManager {
          constructor() {
            this.sfx = {
              stamp: new Audio('assets/audio/stamp.mp3'),
              pageTurn: new Audio('assets/audio/paper-turn.mp3'),
              click: new Audio('assets/audio/jade-click.mp3')
            };
            this.ambientWind = new Audio('assets/audio/ambient-wind.mp3');
            this.ambientWind.loop = true;
            this.ambientWind.volume = 0.7;
            this.currentAmbience = null;
            // 新增一個屬性來儲存音量漸變的計時器
            this.ytFadeInterval = null;
          }

	// 🌟 新增這個漸變控制函數
    fadeYouTubeVolume(targetVolume, duration = 1000) {
        const player = window.ytPlayer || (typeof ytPlayer !== 'undefined' ? ytPlayer : null);
        if (!player || typeof player.getVolume !== 'function') return;

        // 清除之前的漸變計時器，避免快速來回點擊造成衝突
        if (this.ytFadeInterval) clearInterval(this.ytFadeInterval);

        let currentVolume = player.getVolume();
        const steps = 20; // 將漸變分為 20 步
        const intervalTime = duration / steps;
        const volumeStep = (targetVolume - currentVolume) / steps;

        this.ytFadeInterval = setInterval(() => {
            currentVolume += volumeStep;
            
            // 檢查是否已達到或超過目標音量
            if ((volumeStep > 0 && currentVolume >= targetVolume) || 
                (volumeStep < 0 && currentVolume <= targetVolume)) {
                player.setVolume(targetVolume);
                clearInterval(this.ytFadeInterval);
            } else {
                player.setVolume(Math.round(currentVolume));
            }
        }, intervalTime);
    }

          playSFX(name, volume = 1) {
            if (this.sfx[name]) {
              const soundClone = this.sfx[name].cloneNode();
              soundClone.volume = volume;
              soundClone.play().catch(e => console.log('音效播放受限:', e));
            }
          }
          startAmbient() {
            this.ambientWind.play().catch(e => console.log('環境音播放受限:', e));
          }
          enterGameMode(audioSrc) {
            this.fadeYouTubeVolume(20, 1500);
            if (typeof window.updateBgmVolumeState === 'function') {
                window.updateBgmVolumeState(20); // 讓搖桿數值跟著變成 20
            }
            
            if (audioSrc) {
              if (this.currentAmbience) {
                this.currentAmbience.pause();
              }
              this.currentAmbience = new Audio(audioSrc);
              this.currentAmbience.loop = true;
              this.currentAmbience.volume = 0.9; 
              this.currentAmbience.play().catch(e => console.log('篇章音效播放受限:', e));
            }
          }
          exitGameMode() {
            this.fadeYouTubeVolume(100, 1500);
            if (typeof window.updateBgmVolumeState === 'function') {
                window.updateBgmVolumeState(100); 
            }

            if (this.currentAmbience) {
              this.currentAmbience.pause();
              this.currentAmbience = null;
            }
          }
        }

        const SM = new SoundManager();

        function LoadingOverlay({ isLoading }) {
 	   if (!isLoading) return null;

 	   return (
 	       <div className="absolute inset-0 z-50 bg-black/70 backdrop-blur-sm flex flex-col items-center justify-center animate-fade-in pointer-events-auto">
   	         {/* 🌟 帶有旋轉動畫與金光微影的 loading-icon */}
            <img 
                src="loading-icon.webp" 
                alt="Loading..." 
                className="w-10 h-10 animate-spin object-contain filter drop-shadow-[0_0_10px_rgba(201,167,107,0.6)]" 
            />
            <span className="text-[10px] text-[#e0d5ba] tracking-[0.25em] mt-3 animate-pulse">載入中...</span>
        </div>
    );
}

        function useLocalStorage(key, initialValue) {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) { return initialValue; }
            });
            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) {}
            };
            return [storedValue, setValue];
        }

        const preloadImage = (src) => {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = src;
                img.onload = () => resolve({ status: 'success', src });
                img.onerror = () => {
                    console.warn(`圖片載入失敗，略過等待: ${src}`);
                    resolve({ status: 'error', src }); 
                };
            });
        };

        const checkFontsReady = () => {
            if ('fonts' in document) return document.fonts.ready;
            return Promise.resolve();
        };

function App() {
    const [currentPage, setCurrentPage] = useState('start'); 
    const [isLeavingStart, setIsLeavingStart] = useState(false); 
    const [isLeavingLoading, setIsLeavingLoading] = useState(false); 
    const [unlockedPoems, setUnlockedPoems] = useLocalStorage('shijing_unlocked_poems_v4', ['jianjia', 'shejiang', 'qihuan']);
    const [currentPoemId, setCurrentPoemId] = useState(null);
    const [homeTab, setHomeTab] = useState('game'); 
    const [readingPoem, setReadingPoem] = useState(null); 
    const [showMenu, setShowMenu] = useState(false);
    
    // 滾動容器的 Ref
    const scrollContainerRef = useRef(null);
    
    // UI 預熱與預載狀態管理
    const [isUIWarmedUp, setIsUIWarmedUp] = useState(false);
    const [isPreloaded, setIsPreloaded] = useState(false);

    // 當分頁切換時，滾動到頂部
    useEffect(() => {
        if (scrollContainerRef.current) {
            scrollContainerRef.current.scrollTop = 0;
        }
    }, [homeTab, showMenu, showSettings]);

    const [showSettings, setShowSettings] = useState(false);
    const [audioSettings, setAudioSettings] = useLocalStorage('shijing_audio_settings', { bgm: true, bgmVolume: 100, sfx: true });
    const [confirmReset, setConfirmReset] = useState(false); 
    const [toastMessage, setToastMessage] = useState('');
    const [fontSize, setFontSize] = useLocalStorage('shijing_font_size', 'md');

    const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3000);
    };

    // 複製全文至剪貼簿函式
    const handleCopyPoem = (poem) => {
        if (!poem || !poem.fullText || poem.fullText.length === 0) {
            triggerToast("⚠️ 無文字可供複製");
            return;
        }
        
        const textToCopy = `《${poem.title}》 ${poem.author}\n\n` + poem.fullText.join('\n');

        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(textToCopy).then(() => {
                triggerToast("📋 已複製全文至剪貼簿！");
            }).catch(() => {
                fallbackCopy(textToCopy);
            });
        } else {
            fallbackCopy(textToCopy);
        }
    };

    const fallbackCopy = (text) => {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.left = "-9999px";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
            document.execCommand('copy');
            triggerToast("📋 已成功複製全文至剪貼簿！");
        } catch (err) {
            triggerToast("⚠️ 複製失敗，請手動選取文字");
        }
        document.body.removeChild(textArea);
    };

useEffect(() => {
    const player = window.ytPlayer || (typeof ytPlayer !== 'undefined' ? ytPlayer : null);
    if (player && typeof player.playVideo === 'function') {
        if (audioSettings.bgm && audioSettings.bgmVolume > 0) {
            player.playVideo(); // 開啟音樂
            player.setVolume(audioSettings.bgmVolume); // 設定音量
        } else {
            player.pauseVideo(); // 關閉音樂
        }
    }
}, [audioSettings.bgm, audioSettings.bgmVolume]);

    // 🌟 1. 一進入 App (Start 頁面) 即開始背景預載
    useEffect(() => {
        const preloadAllAssets = async () => {
            const poemImages = POEMS
                .filter(p => p.bgImage && p.bgImage.trim() !== "")
                .map(p => p.bgImage);

            const imagesToLoad = [
                './game.webp',
                './loading.webp', 
                './loading-icon.webp',
                ...poemImages 
            ];

            const imagePromise = Promise.all(imagesToLoad.map(src => preloadImage(src)));
            const fontPromise = checkFontsReady();
            const storagePromise = new Promise((resolve) => {
                try {
                    const testKey = '__shijing_test__';
                    window.localStorage.setItem(testKey, 'ok');
                    window.localStorage.removeItem(testKey);
                } catch (e) { console.warn("LocalStorage 目前處於受限模式：", e); }
                resolve();
            });

            await Promise.all([imagePromise, fontPromise, storagePromise]);
            
            // 強制觸發排版計算 (Reflow) 並標記完成
            setIsUIWarmedUp(true);
            setIsPreloaded(true);
        };

        preloadAllAssets();
    }, []);

    // 🌟 2. 點擊開始按鈕
    const startGame = () => {
        const player = window.ytPlayer || ytPlayer;
        if (player && typeof player.playVideo === 'function') {
            try {
                player.unMute();
                player.setVolume(100);
                player.playVideo();
            } catch(e) {
                console.log('BGM 播放受限或異常:', e);
            }
        }
        
        SM.startAmbient();
        SM.playSFX('click', 0.8);

        setIsLeavingStart(true);
        setTimeout(() => {
            // 若在 Start 頁面停留期間資產已預載完成，直接轉至 home；否則進入 loading 頁面等待
            if (isPreloaded) {
                setCurrentPage('home');
            } else {
                setCurrentPage('loading');
            }
        }, 300);
    };

    // 🌟 3. 保留 loading 頁面的獨立預載備案（當使用者極快點擊 Start 按鈕時執行）
    useEffect(() => {
        if (currentPage === 'loading') {
            setIsLeavingLoading(false); // 重置狀態
            const ensureLoaded = async () => {
                const minTimePromise = new Promise(resolve => setTimeout(resolve, 1000));
                
                // 如果在 start 頁面還沒載完，在這裡確保全部載入
                if (!isPreloaded) {
                    const poemImages = POEMS
                        .filter(p => p.bgImage && p.bgImage.trim() !== "")
                        .map(p => p.bgImage);
                    const imagesToLoad = ['./game.webp', './loading.webp', './loading-icon.webp', ...poemImages];
                    await Promise.all([
                        Promise.all(imagesToLoad.map(src => preloadImage(src))),
                        checkFontsReady()
                    ]);
                    setIsPreloaded(true);
                }
                
                await minTimePromise;

                setIsUIWarmedUp(true);
                setIsLeavingLoading(true);
                setTimeout(() => {
                    setCurrentPage('home');
                }, 300);
            };
            ensureLoaded();
        }
    }, [currentPage, isPreloaded]);

    const openPoem = (id) => {
        if (unlockedPoems.includes(id)) {
            setCurrentPoemId(id);
            setCurrentPage('game');
            const poemObj = POEMS.find(p => p.id === id);
            if (poemObj) {
                SM.enterGameMode(poemObj.ambienceAudio);
                const ambienceName = poemObj.ambience || "意境音效";
                setTimeout(() => triggerToast(`🎧 正在播放背景音效：${ambienceName}`), 1000);
            }
        } else {
            triggerToast("此篇尚未解鎖，請先完成前置章節。");
        }
    };

    const handlePoemComplete = (id) => {
        const currentIndex = POEMS.findIndex(p => p.id === id);
        if (currentIndex >= 0 && currentIndex < POEMS.length - 1) {
            const nextId = POEMS[currentIndex + 1].id;
            if (!unlockedPoems.includes(nextId)) {
                setUnlockedPoems([...unlockedPoems, nextId]);
                setTimeout(() => triggerToast(`✨ 恭喜解鎖新篇章：《${POEMS[currentIndex + 1].title}》！`), 800);
            }
        }
        setCurrentPage('home');
    };

    const getCardFontClasses = () => {
        if (fontSize === 'sm') return { title: 'text-xs', author: 'text-[9px]', info: 'text-[8px]' };
        if (fontSize === 'lg') return { title: 'text-base', author: 'text-xs', info: 'text-xs' };
        return { title: 'text-sm', author: 'text-[10px]', info: 'text-[9px]' };

                                <div className="absolute bottom-2 right-2 w-2 h-2 border-b-2 border-r-2 border-[#c9a76b]"></div>

                                <div className="w-14 h-14 rounded-full border-2 border-[#c9a76b] flex items-center justify-center mb-4 bg-red-950/30 shadow-[0_0_15px_rgba(185,28,28,0.3)]">
                                    <i className="fa-solid fa-award text-[#c9a76b] text-2xl"></i>
                                </div>

                                <h2 className="text-lg text-[#e0d5ba] tracking-[0.3em] font-bold mb-1">典藏入卷</h2>

                                <p className="text-gray-300 text-xs mb-6 tracking-wider leading-relaxed">

                                </p>

                                <button 
                                    onClick={onComplete} 
                                    className="w-full py-2.5 rounded border border-[#c9a76b] bg-[#c9a76b]/15 text-[#e0d5ba] hover:bg-[#c9a76b]/30 active:scale-95 transition-all text-xs tracking-[0.2em] font-bold shadow-md clickable-hotspot"
                                >
                                    返回卷軸
                                </button>
                            </div>
                        </div>
                    )}

{/* 設定彈窗 Overlay */}
{showGameSettings && (
                                <div className="settings-overlay fixed inset-0 z-20 bg-black/60 backdrop-blur-sm flex flex-col items-center justify-center animate-fade-in pointer-events-auto px-6">
                                    <div className="bg-[#11100e] border border-[#4a3f2b] rounded-xl w-full max-w-xs p-5 relative shadow-[0_0_20px_rgba(201,167,107,0.15)]">
                                        <h2 className="text-base text-[#c9a76b] tracking-[0.2em] font-bold text-center mb-5 border-b border-[#2d281f] pb-3">系統設置</h2>
                                        <div className="space-y-4 mb-6 px-1">
{/* 背景音樂開關 */}
                <div className="flex justify-between items-center">
                    <span className="text-[#e0d5ba] tracking-widest text-xs">背景音樂</span>
<input 
    type="range" 
    min="0" max="1" step="0.1"
    value={audioSettings.bgmVolume}
    onChange={(e) => setAudioSettings({ ...audioSettings, bgmVolume: parseFloat(e.target.value) })}
    className="w-[45%] h-1.5 bg-[#2d281f] rounded-lg appearance-none cursor-pointer accent-[#c9a76b]"
/>
                    <button 
                        className={`w-10 h-5 rounded-full relative transition-colors duration-300 clickable-hotspot ${audioSettings.bgm ? 'bg-[#c9a76b]' : 'bg-gray-700'}`} 
                        onClick={() => {
                            if (window.SM || typeof SM !== 'undefined') SM.playSFX('click');
                            setAudioSettings({...audioSettings, bgm: !audioSettings.bgm});
                        }}
                    >
                	<div className={`w-3.5 h-3.5 bg-[#11100e] rounded-full absolute top-0.5 transition-transform duration-300 ${audioSettings.bgm ? 'translate-x-6' : 'translate-x-0.5'}`}></div></button></div>
{/* 環境音效開關 */}
                                            <div className="flex justify-between items-center"><span className="text-[#e0d5ba] tracking-widest text-xs">環境音效</span>
<button className={`w-10 h-5 rounded-full relative transition-colors duration-300 clickable-hotspot ${audioSettings.sfx ? 'bg-[#c9a76b]' : 'bg-gray-700'}`} 
onClick={() => {
                            if (window.SM || typeof SM !== 'undefined') SM.playSFX('click');
                            setAudioSettings({...audioSettings, sfx: !audioSettings.sfx});
                        }}>
<div className={`w-3.5 h-3.5 bg-[#11100e] rounded-full absolute top-0.5 transition-transform duration-300 ${audioSettings.sfx ? 'translate-x-6' : 'translate-x-0.5'}`}></div></button></div>
                                        </div>
                                        {/* 字體大小選擇 */}
            <div className="pt-2">
                <div className="flex justify-between items-center mb-1.5">
                    <span className="text-[#e0d5ba] tracking-widest text-xs">字體大小</span>
                    <span className="text-[#c9a76b] font-bold text-[10px] uppercase">{fontSize === 'sm' ? '精緻小' : fontSize === 'lg' ? '醒目大' : '標準中'}</span>
                </div>
                <div className="flex gap-2.5 mb-3">
                    {['sm', 'md', 'lg'].map(sz => (
                        <button 
                            key={sz} 
                            onClick={() => {
                                if (window.SM || typeof SM !== 'undefined') SM.playSFX('click');
                                setFontSize(sz);
                            }} 
                            className={`flex-1 py-1 rounded text-[10px] tracking-widest transition-all clickable-hotspot border ${fontSize === sz ? 'bg-[#c9a76b]/20 border-[#c9a76b] text-[#c9a76b]' : 'bg-transparent border-[#2d281f] text-gray-500'}`}
                        >
                            {sz === 'sm' ? '小' : sz === 'md' ? '中' : '大'}
                        </button>
                    ))}
                </div>
            </div>

{/* 關閉按鈕 */}
            <button className="ink-button"
                onClick={() => setShowGameSettings(false)}
                style={{
                    width: '100%',
                    padding: '8px', 
                    borderRadius: '4px',
                    cursor: 'pointer'
                }}
            >
                關閉</button>
                                        </div>
                                    </div>

                            )}
                </div>
            );
        }

        function InkRingButton({ iconClass, onClick, active, label, isGlowing = false }) {
// 🌟 包裝點擊事件，先播放音效再執行原本的 onClick
    const handleClick = (e) => {
        if (window.SM || typeof SM !== 'undefined') {
            SM.playSFX(sfxType);
        }
        if (onClick) onClick(e);
    };
            return (
                <button 
                    onClick={onClick} 
                    className="flex flex-col items-center justify-center group focus:outline-none clickable-hotspot p-1 -m-1"
                >
                    <div className={`relative w-6 h-6 flex items-center justify-center transition-all duration-300 active:scale-90 ${
                        active ? 'scale-105' : 'scale-100'
                    }`}>
                        <div className={`absolute inset-0 rotate-45 border transition-all duration-500 rounded-[3px] ${
                            active 
                                ? 'border-[#c9a76b] bg-[#c9a76b]/15 shadow-[0_0_10px_rgba(201,167,107,0.4)]' 
                                : 'border-[#2d281f] bg-[#12110e]/80 group-hover:border-gray-500'
                        }`} />

                        {active && (
                            <div className="absolute inset-0 rotate-45 border border-[#c9a76b]/40 rounded-[3px] scale-125 pointer-events-none" />
                        )}

                        <div className="z-10">
                            <i className={`${iconClass} text-xs pb-2 ${active ? 'text-[#c9a76b]' : 'text-gray-400'}`}></i>
                        </div>
                    </div>

                    <span className={`text-[9px] mt-1 tracking-wider transition-all ${
                        isGlowing 
                            ? 'text-[#fff5d1] font-bold drop-shadow-[0_0_8px_rgba(201,167,107,1)] animate-pulse' 
                            : active ? 'text-[#c9a76b]' : 'text-gray-400'
                    }`}>
                        {label}
                    </span>
                </button>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <App />
        );
    </script>
